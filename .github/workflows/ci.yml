name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate shell scripts
        run: |
          shellcheck \
            docker-entrypoint.sh \
            scripts/resolve-release.sh \
            healthcheck.sh \
            scripts/install.sh \
            scripts/select-platform.sh \
            scripts/show-bindclient.sh

      - name: Test platform selection
        run: |
          test "$(RBOT_MACHINE=x86_64 sh scripts/select-platform.sh | sed -n 's/^platform=//p')" = linux/amd64
          printf 'Features : fp asimd atomics\n' > /tmp/cpuinfo-lse
          test "$(RBOT_MACHINE=arm64 RBOT_CPUINFO=/tmp/cpuinfo-lse sh scripts/select-platform.sh | sed -n 's/^platform=//p')" = linux/arm64
          printf 'Features : fp asimd\n' > /tmp/cpuinfo-no-lse
          test "$(RBOT_MACHINE=arm64 RBOT_CPUINFO=/tmp/cpuinfo-no-lse sh scripts/select-platform.sh | sed -n 's/^platform=//p')" = linux/amd64
          test "$(RBOT_PLATFORM=linux/arm64 RBOT_MACHINE=x86_64 sh scripts/select-platform.sh | sed -n 's/^platform=//p')" = linux/arm64

      - name: Test binding command output
        run: |
          mkdir -p /tmp/rbot-test-bin
          cat > /tmp/rbot-test-bin/docker <<'EOF'
          #!/bin/sh
          set -eu
          [ "$1" = compose ]
          [ "$2" = exec ]
          [ "$3" = -T ]
          shift 4
          exec "$@"
          EOF
          chmod +x /tmp/rbot-test-bin/docker
          printf 'username=test-user\npassword=test-password\n' > /tmp/client_config
          output="$(PATH="/tmp/rbot-test-bin:$PATH" RBOT_CONFIG=/tmp/client_config sh scripts/show-bindclient.sh)"
          test "$output" = '/bindclient test-user test-password'
          printf 'username=test-user\npassword=\n' > /tmp/client_config
          if PATH="/tmp/rbot-test-bin:$PATH" RBOT_CONFIG=/tmp/client_config sh scripts/show-bindclient.sh; then
            echo 'Expected empty password to fail' >&2
            exit 1
          fi

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build AMD64 image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          build-args: |
            REPOSITORY_URL=${{ github.server_url }}/${{ github.repository }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

