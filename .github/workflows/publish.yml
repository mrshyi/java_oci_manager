name: Publish image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Upstream version without the leading v; empty means latest
        required: false
        type: string
      force:
        description: Rebuild even when the version tag exists in all target registries
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 1 * * *"
  repository_dispatch:
    types: [upstream-release]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Resolve upstream release
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          scripts/resolve-release.sh "${REQUESTED_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Detect optional Docker Hub publishing
        id: dockerhub
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -n "${DOCKERHUB_USERNAME}" && -n "${DOCKERHUB_TOKEN}" ]]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
            echo "username=${DOCKERHUB_USERNAME,,}" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set image names and tags
        id: image
        env:
          VERSION: ${{ steps.release.outputs.version }}
          IS_LATEST: ${{ steps.release.outputs.is_latest }}
          DOCKERHUB_ENABLED: ${{ steps.dockerhub.outputs.enabled }}
          DOCKERHUB_USERNAME: ${{ steps.dockerhub.outputs.username }}
        run: |
          set -euo pipefail
          ghcr_image="ghcr.io/${GITHUB_REPOSITORY,,}"
          dockerhub_image=""
          if [[ "${DOCKERHUB_ENABLED}" == "true" ]]; then
            dockerhub_repo="${GITHUB_REPOSITORY#*/}"
            dockerhub_image="docker.io/${DOCKERHUB_USERNAME,,}/${dockerhub_repo,,}"
          fi
          {
            echo "ghcr=${ghcr_image}"
            echo "dockerhub=${dockerhub_image}"
            echo "tags<<EOF"
            echo "${ghcr_image}:${VERSION}"
            if [[ "${IS_LATEST}" == "true" ]]; then
              echo "${ghcr_image}:latest"
            fi
            if [[ "${DOCKERHUB_ENABLED}" == "true" ]]; then
              echo "${dockerhub_image}:${VERSION}"
              if [[ "${IS_LATEST}" == "true" ]]; then
                echo "${dockerhub_image}:latest"
              fi
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Log in to Docker Hub
        if: ${{ steps.dockerhub.outputs.enabled == 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: docker.io
          username: ${{ steps.dockerhub.outputs.username }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check whether version is already published
        id: existing
        env:
          FORCE: ${{ inputs.force }}
          GHCR_IMAGE: ${{ steps.image.outputs.ghcr }}
          DOCKERHUB_ENABLED: ${{ steps.dockerhub.outputs.enabled }}
          DOCKERHUB_IMAGE: ${{ steps.image.outputs.dockerhub }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "${FORCE:-false}" == "true" ]]; then
            echo "build=true" >> "${GITHUB_OUTPUT}"
          elif ! docker buildx imagetools inspect "${GHCR_IMAGE}:${VERSION}" >/dev/null 2>&1; then
            echo "build=true" >> "${GITHUB_OUTPUT}"
          elif [[ "${DOCKERHUB_ENABLED}" == "true" ]] \
            && ! docker buildx imagetools inspect "${DOCKERHUB_IMAGE}:${VERSION}" >/dev/null 2>&1; then
            echo "build=true" >> "${GITHUB_OUTPUT}"
          else
            echo "build=false" >> "${GITHUB_OUTPUT}"
            echo "Version ${VERSION} exists in every configured registry; skipping."
          fi

      - name: Build and push multi-architecture image
        if: ${{ steps.existing.outputs.build == 'true' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          build-args: |
            RBOT_VERSION=${{ steps.release.outputs.version }}
            RBOT_SHA256_AMD64=${{ steps.release.outputs.sha256_amd64 }}
            RBOT_SHA256_ARM64=${{ steps.release.outputs.sha256_arm64 }}
            BUILD_DATE=${{ steps.release.outputs.published_at }}
            VCS_REF=${{ github.sha }}
            REPOSITORY_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Write job summary
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SOURCE_TAG: ${{ steps.release.outputs.source_tag }}
          IS_LATEST: ${{ steps.release.outputs.is_latest }}
          BUILD: ${{ steps.existing.outputs.build }}
          TAGS: ${{ steps.image.outputs.tags }}
        run: |
          {
            echo "## java_oci_manage image"
            echo
            echo "- Upstream release: \`${SOURCE_TAG}\`"
            echo "- Version: \`${VERSION}\`"
            echo "- Updates latest tag: \`${IS_LATEST}\`"
            echo "- Built in this run: \`${BUILD}\`"
            echo "- Tags:"
            while IFS= read -r tag; do echo "  - \`${tag}\`"; done <<< "${TAGS}"
          } >> "${GITHUB_STEP_SUMMARY}"

